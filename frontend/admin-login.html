<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Threadly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-page">
    <div class="admin-login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="admin-logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h1>Threadly<span class="admin-badge">ADMIN</span></h1>
                <p class="tagline">Store Management Portal</p>
            </div>

            <div class="login-form-wrapper">
                <h2>Administrator Login</h2>
                <p class="login-subtitle">Please enter your credentials to manage Threadly</p>

                <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                    <div class="form-group">
                        <label>ADMIN EMAIL ADDRESS</label>
                        <div class="input-wrapper">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="email" id="adminEmail" placeholder="admin@threadly.shop" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label>SECURITY KEY</label>
                            <a href="#" class="forgot-link">Forgot key?</a>
                        </div>
                        <div class="input-wrapper">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="adminPassword" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="form-checkbox">
                        <label>
                            <input type="checkbox" id="keepLogged">
                            <span>Keep me logged in</span>
                        </label>
                    </div>

                    <button type="submit" class="login-btn">
                        Enter Admin Panel
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </form>

                <div class="ssl-indicator">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>SECURE SSL CONNECTION ACTIVE</span>
                </div>
            </div>

            <div class="login-footer">
                <a href="index.html">← Return to Storefront</a>
                <div class="footer-links">
                    <a href="#">IT Support</a>
                    <a href="#">Security Policy</a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
